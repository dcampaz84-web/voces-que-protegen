<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Juego educativo para reconocer, prevenir y actuar frente a las violencias en la infancia." />
<meta name="theme-color" content="#C8302E" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>Voces que Protegen — Juego Educativo · Infancia Protegida</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23C8302E' width='192' height='192'/><text x='50%' y='50%' font-size='100' dy='.3em' text-anchor='middle' dominant-baseline='middle'>🛡️</text></svg>" />
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23C8302E' width='180' height='180'/><text x='50%' y='50%' font-size='90' dy='.3em' text-anchor='middle' dominant-baseline='middle'>🛡️</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --rojo: #C8302E;
    --rojo-osc: #9B1C1A;
    --amarillo: #F4C430;
    --amarillo-cl: #FFE08A;
    --teal: #2A8D8A;
    --teal-osc: #1E5F5E;
    --navy: #1F2A44;
    --crema: #FFF6E0;
    --crema-osc: #F4E8C8;
    --texto: #2A2118;
    --verde: #5CA85C;
    --rosa: #FBD9CF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--crema);
    color: var(--texto);
    line-height: 1.5;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 10% 5%, rgba(244,196,48,0.25), transparent 35%),
      radial-gradient(circle at 95% 90%, rgba(200,48,46,0.18), transparent 40%),
      radial-gradient(circle at 80% 10%, rgba(42,141,138,0.15), transparent 35%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .display { font-family: 'Anton', sans-serif; letter-spacing: 0.5px; text-transform: uppercase; }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header .eyebrow {
    display: inline-block;
    background: var(--navy);
    color: var(--amarillo);
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .header h1 {
    font-family: 'Anton', sans-serif;
    font-size: clamp(42px, 8vw, 78px);
    line-height: 0.92;
    color: var(--rojo);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .header h1 span { color: var(--navy); display: block; }
  .header p.sub {
    margin-top: 14px;
    font-size: 15px;
    color: #555;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  /* CARD */
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 10px 40px rgba(31,42,68,0.12), 0 2px 4px rgba(0,0,0,0.04);
    border: 1px solid rgba(31,42,68,0.06);
    margin-bottom: 22px;
    animation: slideUp 0.5s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* PROGRESS */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: var(--crema-osc);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rojo), var(--amarillo));
    border-radius: 999px;
    transition: width 0.5s ease;
  }
  .progress-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    white-space: nowrap;
  }

  /* INTRO */
  .intro-icon {
    display: inline-block;
    background: var(--rojo);
    color: #fff;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 18px;
  }
  .intro-title {
    font-family: 'Anton', sans-serif;
    font-size: clamp(28px, 5vw, 42px);
    text-align: center;
    color: var(--navy);
    margin-bottom: 10px;
    line-height: 1;
  }
  .movie-ref {
    background: linear-gradient(135deg, var(--navy) 0%, #2d3a5c 100%);
    color: var(--crema);
    padding: 22px 24px;
    border-radius: 14px;
    margin: 20px 0;
    border-left: 5px solid var(--amarillo);
  }
  .movie-ref .movie-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--amarillo);
    margin-bottom: 6px;
  }
  .movie-ref .movie-title {
    font-family: 'Anton', sans-serif;
    font-size: 24px;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .movie-ref p { font-size: 14.5px; opacity: 0.92; }

  .intro-list {
    list-style: none;
    margin: 18px 0;
  }
  .intro-list li {
    padding: 10px 0 10px 36px;
    position: relative;
    font-size: 15px;
  }
  .intro-list li::before {
    content: "✓";
    position: absolute;
    left: 0;
    top: 8px;
    background: var(--teal);
    color: #fff;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
  }

  /* INPUTS */
  .input-text {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--crema-osc);
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    margin: 8px 0 18px;
    transition: border 0.2s;
  }
  .input-text:focus {
    outline: none;
    border-color: var(--teal);
  }

  /* QUESTION */
  .q-label {
    display: inline-block;
    background: var(--amarillo);
    color: var(--navy);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .q-text {
    font-size: clamp(18px, 3vw, 22px);
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 22px;
    line-height: 1.35;
  }
  .q-hint {
    font-size: 13px;
    color: #777;
    margin-bottom: 16px;
    font-style: italic;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    background: var(--crema);
    border: 2px solid var(--crema-osc);
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: 15px;
    color: var(--texto);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .option:hover:not(.disabled) {
    background: #fff;
    border-color: var(--teal);
    transform: translateX(4px);
  }
  .option .opt-letter {
    background: var(--navy);
    color: #fff;
    width: 28px;
    height: 28px;
    min-width: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
  }
  .option.correct {
    background: #E8F5E8;
    border-color: var(--verde);
  }
  .option.correct .opt-letter { background: var(--verde); }
  .option.wrong {
    background: #FBE8E8;
    border-color: var(--rojo);
  }
  .option.wrong .opt-letter { background: var(--rojo); }
  .option.disabled { cursor: not-allowed; }
  .option.selected {
    background: #fff;
    border-color: var(--teal);
  }

  /* MULTI-SELECT options */
  .option.multi .opt-check {
    width: 22px; height: 22px; min-width: 22px;
    border: 2px solid var(--navy);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    background: #fff;
    font-size: 14px;
    color: transparent;
  }
  .option.multi.selected .opt-check {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }
  .option.multi.correct .opt-check { background: var(--verde); border-color: var(--verde); color: #fff; }
  .option.multi.wrong .opt-check { background: var(--rojo); border-color: var(--rojo); color: #fff; }

  /* ORDER (drag list) */
  .order-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .order-item {
    background: var(--crema);
    border: 2px solid var(--crema-osc);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 15px;
  }
  .order-controls {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .order-btn {
    background: var(--navy);
    color: #fff;
    border: none;
    width: 28px;
    height: 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transition: background 0.2s;
  }
  .order-btn:hover { background: var(--teal); }
  .order-btn:disabled { background: #ccc; cursor: not-allowed; }
  .order-text { flex: 1; }
  .order-num {
    background: var(--rojo);
    color: #fff;
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Anton', sans-serif;
    font-size: 18px;
  }
  .order-item.correct { background: #E8F5E8; border-color: var(--verde); }
  .order-item.correct .order-num { background: var(--verde); }
  .order-item.wrong { background: #FBE8E8; border-color: var(--rojo); }

  /* FEEDBACK */
  .feedback {
    margin-top: 20px;
    padding: 18px 20px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.55;
    animation: slideUp 0.4s ease;
  }
  .feedback.ok {
    background: #E8F5E8;
    border-left: 5px solid var(--verde);
  }
  .feedback.no {
    background: #FBE8E8;
    border-left: 5px solid var(--rojo);
  }
  .feedback strong { display: block; margin-bottom: 6px; color: var(--navy); }

  /* BUTTONS */
  .btn-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 24px;
    gap: 12px;
  }
  .btn {
    background: var(--rojo);
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn:hover { background: var(--rojo-osc); transform: translateY(-2px); }
  .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
  .btn.secondary { background: var(--navy); }
  .btn.secondary:hover { background: #0f1729; }
  .btn.big {
    padding: 18px 36px;
    font-size: 17px;
  }

  /* TEXTAREA */
  textarea {
    width: 100%;
    min-height: 130px;
    padding: 16px;
    border: 2px solid var(--crema-osc);
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    resize: vertical;
    transition: border 0.2s;
  }
  textarea:focus { outline: none; border-color: var(--teal); }

  /* RESULTS */
  .result-icon {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    background: var(--amarillo);
  }
  .score-display {
    text-align: center;
  }
  .score-big {
    font-family: 'Anton', sans-serif;
    font-size: clamp(64px, 14vw, 110px);
    color: var(--rojo);
    line-height: 1;
  }
  .score-total {
    font-size: 18px;
    color: #777;
    font-weight: 600;
  }
  .score-label {
    margin-top: 12px;
    font-family: 'Anton', sans-serif;
    font-size: 28px;
    color: var(--navy);
    letter-spacing: 1px;
  }

  /* 141 BANNER */
  .banner-141 {
    background: var(--rojo);
    color: #fff;
    padding: 24px;
    border-radius: 16px;
    margin: 24px 0;
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 22px;
  }
  .banner-141 .num {
    font-family: 'Anton', sans-serif;
    font-size: 72px;
    line-height: 0.9;
    color: var(--amarillo);
  }
  .banner-141 .label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 4px;
  }
  .banner-141 .title {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .banner-141 p { font-size: 14px; opacity: 0.95; }

  /* SHARE */
  .share-box {
    background: var(--crema);
    border: 2px dashed var(--navy);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    margin-top: 20px;
  }
  .share-box .lbl {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--navy);
    font-weight: 700;
    margin-bottom: 10px;
  }

  /* REFLEXIÓN BOX */
  .reflexion-tag {
    display: inline-block;
    background: var(--teal);
    color: #fff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 30px;
    font-size: 13px;
    color: #777;
  }
  .footer strong { color: var(--rojo); }

  /* PWA Install Banner */
  .pwa-install-banner {
    display: none;
    background: var(--navy);
    color: #fff;
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 4px 12px rgba(31,42,68,0.2);
  }
  .pwa-install-banner.show {
    display: flex;
  }
  .pwa-install-banner .install-btn {
    background: var(--rojo);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .pwa-install-banner .install-btn:hover {
    background: var(--rojo-osc);
  }
  .pwa-install-banner .close-btn {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 20px;
    padding: 0;
    margin-left: auto;
  }

  /* Animations */
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .pulse { animation: pulse 1.5s infinite; }

  @media (max-width: 600px) {
    .card { padding: 26px 20px; }
    .banner-141 { grid-template-columns: 1fr; text-align: center; }
    .banner-141 .num { font-size: 60px; }
    .pwa-install-banner {
      flex-direction: column;
      align-items: flex-start;
    }
    .pwa-install-banner .close-btn {
      margin-left: auto;
      margin-top: -8px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- PWA Install Banner -->
  <div class="pwa-install-banner" id="installBanner">
    <span>📱 Descarga esta app en tu dispositivo</span>
    <button class="install-btn" id="installBtn">Instalar</button>
    <button class="close-btn" onclick="document.getElementById('installBanner').classList.remove('show')">✕</button>
  </div>

  <!-- HEADER -->
  <div class="header">
    <div class="eyebrow">Campaña · Encuentro 6 · Rutas de Atención</div>
    <h1>Voces que <span>Protegen</span></h1>
    <p class="sub">Un juego para reconocer, prevenir y actuar frente a las violencias en la infancia.</p>
  </div>

  <!-- GAME CONTAINER -->
  <div id="game"></div>

  <div class="footer">
    Inspirado en la película <strong>Sonido de Libertad</strong> (Alejandro Monteverde, 2023).<br>
    Proteger es educar. Denunciar es amar.
  </div>
</div>

<script>
// =====================================================
//  PWA INSTALLATION
// =====================================================
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

document.getElementById('installBtn')?.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log(`User response to the install prompt: ${outcome}`);
    deferredPrompt = null;
    document.getElementById('installBanner').classList.remove('show');
  }
});

// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => 
    console.log('Service Worker registration failed:', err)
  );
}

// =====================================================
//  ESTADO DEL JUEGO
// =====================================================
const state = {
  name: "",
  step: 0,          // 0 = intro, 1..N = preguntas, N+1 = reflexión, N+2 = resultado
  answers: [],
  score: 0,
  reflection: ""
};

// =====================================================
//  PREGUNTAS
// =====================================================
const questions = [
  // ---- 1: Tipos de violencia ----
  {
    tipo: "single",
    seccion: "Tipos de Violencia",
    pregunta: "Un docente humilla constantemente a un estudiante frente a sus compañeros, lo descalifica y lo hace sentir menos. ¿Qué tipo de violencia ejerce?",
    opciones: [
      "Violencia física",
      "Violencia psicológica",
      "Violencia digital",
      "Negligencia"
    ],
    correcta: 1,
    feedback_ok: "La violencia psicológica incluye insultos, humillaciones, amenazas, rechazo o indiferencia. Aunque no deja marcas visibles, deja huellas profundas en el desarrollo emocional del niño.",
    feedback_no: "Era violencia psicológica. Incluye insultos, humillaciones, amenazas, rechazo o indiferencia. Aunque no deja marcas visibles, deja huellas profundas en el desarrollo del niño."
  },
  // ---- 2: Violencia sexual / referencia a la película ----
  {
    tipo: "single",
    seccion: "Tipos de Violencia",
    pregunta: "La película Sonido de Libertad expone una de las formas más graves de violencia contra la niñez: el tráfico y la explotación sexual infantil. Esta problemática es:",
    opciones: [
      "Un problema lejano que solo ocurre en otros países",
      "Algo poco probable que afecte a niños en zonas urbanas",
      "Un fenómeno global presente también en Colombia, que requiere acción de todos",
      "Un asunto exclusivo de las autoridades, no de los docentes"
    ],
    correcta: 2,
    feedback_ok: "Correcto. La trata y explotación infantil es un fenómeno global. En Colombia, el ICBF y la Línea 141 atienden estos casos. Los docentes somos un eslabón fundamental para identificar y reportar señales tempranas.",
    feedback_no: "La trata y explotación infantil es un fenómeno global, también presente en Colombia. Los docentes somos un eslabón fundamental para identificar y reportar señales tempranas — no podemos delegar exclusivamente esta responsabilidad."
  },
  // ---- 3: Negligencia ----
  {
    tipo: "single",
    seccion: "Tipos de Violencia",
    pregunta: "Un niño llega frecuentemente al colegio sin desayunar, con ropa sucia y sin útiles. Su familia tiene los recursos. Esto puede ser:",
    opciones: [
      "Una situación normal, no es nuestro asunto",
      "Negligencia: abandono y necesidades básicas no cubiertas",
      "Solo un problema de organización del hogar",
      "Violencia física"
    ],
    correcta: 1,
    feedback_ok: "Exacto. La negligencia es una forma de violencia: el abandono, la falta de atención y las necesidades básicas no cubiertas vulneran los derechos del niño y deben reportarse.",
    feedback_no: "Es negligencia, una forma de violencia que muchas veces pasa desapercibida. El abandono y las necesidades básicas no cubiertas son una vulneración de derechos y deben reportarse."
  },
  // ---- 4: Señales de alerta - multi ----
  {
    tipo: "multi",
    seccion: "Señales de Alerta",
    pregunta: "Marca TODAS las señales que pueden indicar que un niño o niña está viviendo una situación de violencia:",
    hint: "Puedes seleccionar varias opciones.",
    opciones: [
      "Cambios bruscos de ánimo o conducta",
      "Lesiones frecuentes sin explicación",
      "Conocimiento sexual inapropiado para su edad",
      "Sacar buenas notas en matemáticas",

// =====================================================
//  RENDER
// =====================================================
const $game = document.getElementById('game');

function render() {
  if (state.step === 0) renderIntro();
  else if (state.step <= questions.length) renderQuestion(state.step - 1);
  else if (state.step === questions.length + 1) renderReflexion();
  else renderResults();
}

// ------ INTRO ------
function renderIntro() {
  $game.innerHTML = `
    <div class="card">
      <div style="text-align:center;">
        <div style="background:var(--rojo);color:#fff;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 18px;">🛡️</div>
        <h2 class="intro-title">Antes de empezar...</h2>
        <p style="max-width:520px;margin:0 auto;color:#555;">Este juego es una invitación a reconocer, prevenir y actuar frente a las violencias en la infancia. Cada respuesta refuerza tu rol como agente protector.</p>
      </div>

      <div class="movie-ref">
        <div class="movie-tag">🎬 Inspirado en la película</div>
        <div class="movie-title">Sonido de Libertad</div>
        <p>Dirigida por Alejandro Monteverde (2023), esta película basada en hechos reales expone la oscuridad del tráfico de niños y niñas. Nos recuerda que <strong>cada infancia importa</strong> y que la mirada atenta del docente puede salvar vidas.</p>
      </div>

      <h3 style="margin:24px 0 8px;color:var(--navy);font-size:18px;">¿Qué pondrás a prueba?</h3>
      <ul class="intro-list">
        <li>Identificar los <strong>tipos de violencia</strong> contra la niñez</li>
        <li>Reconocer las <strong>señales de alerta</strong> en niños y niñas</li>
        <li>Aplicar correctamente la <strong>ruta de atención</strong></li>
        <li>Asumir tu <strong>quehacer docente</strong> como agente protector</li>
      </ul>

      <label style="display:block;margin-top:20px;font-weight:700;color:var(--navy);font-size:14px;">¿Cómo te llamas?</label>
      <input type="text" id="player-name" class="input-text" placeholder="Escribe tu nombre..." />

      <div class="btn-row">
        <button class="btn big" onclick="startGame()">Empezar juego →</button>
      </div>
    </div>
  `;
}

function startGame() {
  const name = document.getElementById('player-name').value.trim();
  if (!name) {
    document.getElementById('player-name').focus();
    document.getElementById('player-name').style.borderColor = 'var(--rojo)';
    return;
  }
  state.name = name;
  state.step = 1;
  render();
}

// ------ PROGRESS ------
function progressHTML() {
  const pct = (state.step / (questions.length + 1)) * 100;
  return `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text">${state.step} / ${questions.length + 1}</div>
    </div>
  `;
}

// ------ PREGUNTA ------
function renderQuestion(idx) {
  const q = questions[idx];
  let html = `<div class="card">${progressHTML()}
    <div class="q-label">${q.seccion}</div>
    <div class="q-text">${q.pregunta}</div>`;

  if (q.hint) html += `<div class="q-hint">💡 ${q.hint}</div>`;

  if (q.tipo === 'single') {
    html += `<div class="options" id="opts">`;
    q.opciones.forEach((o, i) => {
      const letter = String.fromCharCode(65 + i);
      html += `<button class="option" data-idx="${i}" onclick="answerSingle(${idx}, ${i})">
        <span class="opt-letter">${letter}</span><span>${o}</span>
      </button>`;
    });
    html += `</div>`;
  }
  else if (q.tipo === 'multi') {
    html += `<div class="options" id="opts">`;
    q.opciones.forEach((o, i) => {
      html += `<button class="option multi" data-idx="${i}" onclick="toggleMulti(${i})">
        <span class="opt-check">✓</span><span>${o}</span>
      </button>`;
    });
    html += `</div>
      <div class="btn-row"><button class="btn" id="confirm-multi" onclick="answerMulti(${idx})">Confirmar respuesta →</button></div>`;
  }
  else if (q.tipo === 'order') {
    // estado inicial: orden aleatorio
    if (!q._currentOrder) {
      q._currentOrder = q.pasos.map((_, i) => i);
      // Mezclamos
      for (let i = q._currentOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [q._currentOrder[i], q._currentOrder[j]] = [q._currentOrder[j], q._currentOrder[i]];
      }
    }
    html += `<ul class="order-list" id="order-list">`;
    q._currentOrder.forEach((pasoIdx, pos) => {
      html += `<li class="order-item" data-pos="${pos}">
        <span class="order-num">${pos + 1}</span>
        <span class="order-text">${q.pasos[pasoIdx]}</span>
        <span class="order-controls">
          <button class="order-btn" onclick="moveOrder(${idx}, ${pos}, -1)" ${pos === 0 ? 'disabled' : ''}>▲</button>
          <button class="order-btn" onclick="moveOrder(${idx}, ${pos}, 1)" ${pos === q._currentOrder.length - 1 ? 'disabled' : ''}>▼</button>
        </span>
      </li>`;
    });
    html += `</ul>
      <div class="btn-row"><button class="btn" onclick="answerOrder(${idx})">Confirmar orden →</button></div>`;
  }

  html += `<div id="feedback-box"></div></div>`;
  $game.innerHTML = html;
}

// ------ SINGLE answer ------
function answerSingle(qIdx, optIdx) {
  const q = questions[qIdx];
  const correct = optIdx === q.correcta;
  state.answers.push(correct);
  if (correct) state.score++;

  document.querySelectorAll('#opts .option').forEach((el, i) => {
    el.classList.add('disabled');
    el.onclick = null;
    if (i === q.correcta) el.classList.add('correct');
    if (i === optIdx && !correct) el.classList.add('wrong');
  });

  showFeedback(correct, correct ? q.feedback_ok : q.feedback_no);
}

// ------ MULTI ------
let multiSelected = new Set();

function toggleMulti(i) {
  const el = document.querySelector(`#opts .option[data-idx="${i}"]`);
  if (el.classList.contains('disabled')) return;
  if (multiSelected.has(i)) {
    multiSelected.delete(i);
    el.classList.remove('selected');
  } else {
    multiSelected.add(i);
    el.classList.add('selected');
  }
}

function answerMulti(qIdx) {
  const q = questions[qIdx];
  const correctSet = new Set(q.correctas);
  const userSet = multiSelected;

  let correct = correctSet.size === userSet.size &&
                [...correctSet].every(x => userSet.has(x));

  state.answers.push(correct);
  if (correct) state.score++;

  document.querySelectorAll('#opts .option').forEach((el, i) => {
    el.classList.add('disabled');
    el.onclick = null;
    el.classList.remove('selected');
    if (correctSet.has(i)) el.classList.add('correct');
    else if (userSet.has(i)) el.classList.add('wrong');
  });

  document.getElementById('confirm-multi').style.display = 'none';
  showFeedback(correct, correct ? q.feedback_ok : q.feedback_no);

  multiSelected = new Set();
}

// ------ ORDER ------
function moveOrder(qIdx, pos, dir) {
  const q = questions[qIdx];
  const arr = q._currentOrder;
  const target = pos + dir;
  if (target < 0 || target >= arr.length) return;
  [arr[pos], arr[target]] = [arr[target], arr[pos]];
  renderQuestion(qIdx); // re-render
}

function answerOrder(qIdx) {
  const q = questions[qIdx];
  const correct = JSON.stringify(q._currentOrder) === JSON.stringify(q.orden_correcto);
  state.answers.push(correct);
  if (correct) state.score++;

  // marcar items
  document.querySelectorAll('#order-list .order-item').forEach((el, pos) => {
    el.querySelectorAll('.order-btn').forEach(b => b.disabled = true);
    const userVal = q._currentOrder[pos];
    const correctVal = q.orden_correcto[pos];
    if (userVal === correctVal) el.classList.add('correct');
    else el.classList.add('wrong');
  });

  // mostrar el orden correcto si no acertó
  let extraMsg = q.feedback_no;
  if (correct) extraMsg = q.feedback_ok;

  document.querySelector('.btn-row .btn').style.display = 'none';
  showFeedback(correct, extraMsg);
}

// ------ FEEDBACK ------
function showFeedback(ok, msg) {
  const box = document.getElementById('feedback-box');
  const title = ok ? '✅ ¡Correcto!' : '❌ No es la respuesta correcta';
  box.innerHTML = `
    <div class="feedback ${ok ? 'ok' : 'no'}">
      <strong>${title}</strong>${msg}
    </div>
    <div class="btn-row">
      <button class="btn" onclick="nextStep()">Siguiente →</button>
    </div>
  `;
}

function nextStep() {
  state.step++;
  render();
}

// ------ REFLEXIÓN ------
function renderReflexion() {
  $game.innerHTML = `
    <div class="card">
      ${progressHTML()}
      <div class="reflexion-tag">🌱 Reflexión Docente</div>
      <h2 style="font-family:'Anton',sans-serif;font-size:32px;color:var(--navy);margin-bottom:12px;line-height:1.05;">Tu compromiso transforma vidas</h2>
      <p style="color:#555;margin-bottom:20px;">
        Antes de ver tu resultado, ${state.name}, queremos que te tomes un momento. La película Sonido de Libertad nos recuerda que <em>"los hijos de Dios no están en venta"</em>. Como docente, tu mirada atenta puede cambiar una historia.
      </p>

      <label style="display:block;font-weight:700;color:var(--navy);margin-bottom:8px;font-size:15px;">
        ¿Qué acción concreta te comprometes a implementar en tu aula para prevenir las violencias en la infancia?
      </label>
      <textarea id="reflexion" placeholder="Escribe tu compromiso aquí..."></textarea>

      <div class="btn-row">
        <button class="btn big" onclick="submitReflexion()">Ver mis resultados →</button>
      </div>
    </div>
  `;
}

function submitReflexion() {
  state.reflection = document.getElementById('reflexion').value.trim();
  state.step++;
  render();
}

// ------ RESULTADOS ------
function renderResults() {
  const total = questions.length;
  const pct = Math.round((state.score / total) * 100);

  let nivel, mensaje, emoji, color;
  if (pct >= 80) {
    nivel = "Agente Protector"; emoji = "🌟"; color = "var(--verde)";
    mensaje = "¡Excelente! Demuestras un dominio sólido sobre las rutas de atención y la prevención de violencias en la infancia. Eres una voz que protege.";
  } else if (pct >= 60) {
    nivel = "Mirada Atenta"; emoji = "👀"; color = "var(--amarillo)";
    mensaje = "Vas por buen camino. Conoces lo esencial, pero hay aspectos que vale la pena reforzar para fortalecer tu rol como agente protector.";
  } else {
    nivel = "Sigamos aprendiendo"; emoji = "📚"; color = "var(--rojo)";
    mensaje = "Es un punto de partida. Te invitamos a revisar los temas del curso y conversar con tu equipo: cada conocimiento que sumes puede proteger a un niño.";
  }

  $game.innerHTML = `
    <div class="card score-display">
      <div class="result-icon" style="background:${color};color:#fff;">${emoji}</div>
      <div style="font-size:14px;color:#888;letter-spacing:2px;text-transform:uppercase;font-weight:700;">${state.name}, tu nivel es:</div>
      <div class="score-label">${nivel}</div>
      <div style="margin:20px 0;">
        <span class="score-big">${state.score}</span>
        <span class="score-total">/ ${total}</span>
      </div>
      <p style="max-width:520px;margin:0 auto;color:#555;font-size:15px;">${mensaje}</p>
    </div>

    <div class="card">
      <h3 style="font-family:'Anton',sans-serif;font-size:24px;color:var(--navy);margin-bottom:12px;">📋 Tu compromiso como docente</h3>
      <div style="background:var(--crema);border-left:5px solid var(--teal);padding:18px 20px;border-radius:10px;font-style:italic;color:#444;">
        "${state.reflection || '(No respondiste esta sección)'}"
      </div>
      <p style="margin-top:14px;font-size:14px;color:#666;">
        Comparte este compromiso con tu equipo en el Encuentro 6. Recuerda: las palabras se las lleva el viento, pero <strong>las acciones transforman realidades</strong>.
      </p>
    </div>

    <div class="banner-141">
      <div class="num">141</div>
      <div>
        <div class="label">Línea ICBF · 24/7</div>
        <div class="title">¡Pide Ayuda!</div>
        <p>Gratuita · Confidencial · Disponible siempre. Marca, escucha, actúa. No estás solo: pedir ayuda es el primer paso para proteger.</p>
      </div>
    </div>

    <div class="card">
      <h3 style="font-family:'Anton',sans-serif;font-size:22px;color:var(--rojo);margin-bottom:10px;">🎬 Reflexión final</h3>
      <p style="color:#444;line-height:1.65;">
        Sonido de Libertad nos enseña que detrás de cada cifra hay un nombre, un rostro, una historia. Como docentes, somos muchas veces el primer adulto fuera del hogar que puede notar que algo no está bien. <strong>Tu mirada importa. Tu voz protege. Tu acción puede salvar.</strong>
      </p>
      <p style="margin-top:14px;color:#444;line-height:1.65;">
        Proteger la infancia es construir un país más justo, humano y en paz. <em>¡Juntos podemos hacerlo!</em>
      </p>
    </div>

    <div class="share-box">
      <div class="lbl">Comparte el juego</div>
      <p style="margin-bottom:12px;font-size:14px;color:#555;">Invita a otros docentes y familias a ponerse a prueba.</p>
      <button class="btn secondary" onclick="restart()">↻ Jugar de nuevo</button>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  state.step = 0;
  state.score = 0;
  state.answers = [];
  state.reflection = "";
  state.name = "";
  questions.forEach(q => { if (q._currentOrder) delete q._currentOrder; });
  render();
}

// =====================================================
//  ARRANQUE
// =====================================================
render();
</script>
